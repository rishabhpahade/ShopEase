{% extends 'base.html' %}

{% block title %}{{ error_code|default(404) }} — Page Not Found{% endblock %}

{% block content %}
<section class="section page-section">
    <div class="container">
        <div class="error-page">
            <div class="error-code">{{ error_code|default(404) }}</div>
            <h1 class="error-title">Oops!</h1>
            <p class="error-message">{{ error_message|default('The page you are looking for does not exist.') }}</p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg">Go Home</a>
                <a href="{{ url_for('products') }}" class="btn btn-outline btn-lg">Browse Products</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
