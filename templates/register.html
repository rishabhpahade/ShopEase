{% extends 'base.html' %}

{% block title %}Register — ShopEase{% endblock %}

{% block content %}
<section class="section page-section">
    <div class="container auth-container">
        <div class="auth-card" id="register-form">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join ShopEase and start shopping</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name *</label>
                    <input type="text" name="full_name" id="full_name" class="form-input"
                           placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="username" class="form-label">Username *</label>
                    <input type="text" name="username" id="username" class="form-input"
                           placeholder="Choose a username (min 3 characters)" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input type="email" name="email" id="email" class="form-input"
                           placeholder="you@example.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password *</label>
                        <input type="password" name="password" id="password" class="form-input"
                               placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password *</label>
                        <input type="password" name="confirm_password" id="confirm_password"
                               class="form-input" placeholder="Re-enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="register-btn">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
